# 데일리 스크럼 리포트 (docs/OPERATIONS.md)
# generate: 근무일 확인 → 수집 → 멀티 에이전트 → report.md (Job Summary 에서 미리보기)
# publish : 팀장 승인(Environment) → 승인 마감·중복 확인 → config.yaml 의 모든 채널로 발송 → 이력 기록
# 여러 팀이면 이 파일을 복사해 PM_CONFIG 와 environment 만 바꾼다 (팀마다 승인자가 다르므로).
name: daily-scrum

on:
  schedule:
    - cron: "7 23 * * 0-4"   # UTC 일~목 23:07 = KST 월~금 08:07 (공휴일은 코드가 건너뜀)
  workflow_dispatch:
    inputs:
      since:
        description: "분석 기간 (예: 1d, 7d). 비우면 마지막 발송 리포트 이후"
        required: false
        default: ""
      fixture:
        description: "가상 팀 시연용 fixture (normal_day / risky_day / ci_flaky / quiet_day / monday)"
        required: false
        default: ""
      dry_run:
        description: "각 채널의 테스트 대상(test_*_env)으로만 발송"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  issues: read          # 분석 대상이 이 저장소 자신일 때 기본 토큰으로 수집 (개인 테스트)
  pull-requests: read

concurrency:
  group: daily-scrum-${{ github.workflow }}
  cancel-in-progress: false

env:
  PM_CONFIG: ${{ vars.PM_CONFIG || 'config.yaml' }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      skip: ${{ steps.run.outputs.skip }}
      risks: ${{ steps.run.outputs.risks }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-llm.txt

      # 회사 환경: GitHub App 설치 토큰 (vars.GH_APP_ID 가 있을 때). 없으면 secrets.GH_READ_TOKEN(PAT)
      - name: GitHub App token
        id: app-token
        if: vars.GH_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ vars.GH_APP_OWNER }}
          repositories: ${{ vars.GH_APP_REPOSITORIES }}

      - name: Run PM agent
        id: run
        env:
          TEAM_REPO: ${{ vars.TEAM_REPO }}
          GH_READ_TOKEN: ${{ steps.app-token.outputs.token || secrets.GH_READ_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING: ${{ vars.LANGSMITH_TRACING }}
          FIXTURE: ${{ inputs.fixture }}
          SINCE: ${{ inputs.since }}
          EVENT: ${{ github.event_name }}
        run: |
          ARGS="--config $PM_CONFIG"
          if [ -n "$FIXTURE" ]; then ARGS="$ARGS --fixture fixtures/$FIXTURE.json"; fi
          if [ -n "$SINCE" ]; then ARGS="$ARGS --since $SINCE"; fi
          if [ "$EVENT" = "schedule" ]; then ARGS="$ARGS --scheduled"; fi
          python -m pm_agent.run $ARGS

      - name: Preview for approver
        if: steps.run.outputs.skip != 'true'
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            report.md
            report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Alert on failure
        if: failure()
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: python -m pm_agent.alert --config "$PM_CONFIG" --stage generate || true

  publish:
    needs: generate
    if: needs.generate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: daily-report   # Settings → Environments → Required reviewers = 팀장
    permissions:
      contents: write           # 상태 저장소 브랜치(pm-agent-state)에 발송 기록
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: report
      - name: Send
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}   # config.yaml 의 *_env 이름으로 비밀값을 찾음
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || inputs.fixture != '' && inputs.fixture != null }}
        run: |
          ARGS="--config $PM_CONFIG"
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m pm_agent.publish report.md $ARGS
      - name: Alert on failure
        if: failure()
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: python -m pm_agent.alert --config "$PM_CONFIG" --stage publish || true
